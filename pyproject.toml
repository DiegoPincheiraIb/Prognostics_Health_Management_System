[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rul-mlops"
version = "0.1.0"
description = "Educational predictive maintenance and RUL MLOps example"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2,<4",
  "torch>=2.2,<3",
  "mlflow>=2.14,<3",
  "matplotlib>=3.8,<4",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2,<2.1",
  "psycopg[binary]>=3.1,<4",
  "psycopg2-binary>=2.9,<3",
  "streamlit>=1.36,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
wandb = ["wandb>=0.17,<1"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["rul*"]

[tool.pytest.ini_options]
testpaths = ["tests"]