services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rul}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rul}
      POSTGRES_DB: ${POSTGRES_DB:-rul}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  mlflow:
    image: industrial-rul-mlops:local
    build: .
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql://${POSTGRES_USER:-rul}:${POSTGRES_PASSWORD:-rul}@postgres:5432/${POSTGRES_DB:-rul}
      - --artifacts-destination
      - /mlartifacts
      - --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
  api:
    image: industrial-rul-mlops:local
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rul}:${POSTGRES_PASSWORD:-rul}@postgres:5432/${POSTGRES_DB:-rul}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-industrial-rul}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      RUL_ALERT_THRESHOLD: ${RUL_ALERT_THRESHOLD:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  dashboard:
    image: industrial-rul-mlops:local
    build: .
    command: ["streamlit", "run", "dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
  trainer:
    image: industrial-rul-mlops:local
    build: .
    profiles: ["tools"]
    entrypoint: ["python", "-m", "rul.train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-industrial-rul}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      RUL_ALERT_THRESHOLD: ${RUL_ALERT_THRESHOLD:-30}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  postgres_data:
  mlflow_artifacts: